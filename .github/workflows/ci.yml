name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  UV_LINK_MODE: copy
  NEXT_TELEMETRY_DISABLED: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check src tests

      - name: Ruff format check
        run: uv run ruff format --check src tests

      - name: mypy (strict)
        run: uv run mypy

  backend-test:
    name: Backend tests and offline smoke run
    runs-on: ubuntu-latest
    env:
      # No API keys and no network for models: the offline model answers every task, the mock stores run in-process.
      SHELFWISE_LLM_PROVIDER: fake
      SHELFWISE_LLM_LEDGER: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest --junitxml=report.xml

      - name: CLI smoke run (offline model)
        env:
          SHELFWISE_DATABASE: /tmp/shelfwise.db
          SHELFWISE_WORKSPACE_DIR: /tmp/workspace
          SHELFWISE_RESULTS_DIR: /tmp/results
        run: |
          uv run shelfwise seed --out /tmp/demo-check
          cmp data/demo/gold.json /tmp/demo-check/gold.json
          uv run shelfwise import --demo
          uv run shelfwise enrich --limit 12
          uv run shelfwise approve --actor ci
          uv run shelfwise export --out /tmp/exports/shopify.csv
          head -3 /tmp/exports/shopify.csv
          uv run shelfwise eval run --name ci --limit 16

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-report
          path: report.xml

  frontend:
    name: Frontend lint, typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test, frontend]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: shelfwise-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web image (no push)
        uses: docker/build-push-action@v7
        with:
          context: web
          push: false
          tags: shelfwise-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
